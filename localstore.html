# -<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝水提醒｜本地存储版</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        /* 修改这里就是背景渐变，这一套柔和蓝紫渐变 */
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            padding:20px;
        }
        .card{background:#ffffff;border-radius:24px;padding:36px;width:100%;max-width:520px;text-align:center;box-shadow:0 4px 20px #0000001c}
        .drop{font-size:70px}
        h1{margin:10px 0 20px;font-size:32px;color:#084866}
        .status{font-size:16px;color:#444;margin-bottom:12px}
        select{width:100%;padding:12px;font-size:17px;border-radius:10px;border:solid 1px #bbbbbb}
        .time-view{font-size:48px;margin:24px 0}
        .cup-text{font-size:19px;margin-bottom:16px}
        .button-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        button{padding:12px;font-size:16px;border-radius:10px;border:none}
        #start{background:#23ad5c;color:white}
        #pause{background:#718096;color:white}
        #drink{background:#3182ce;color:white}
        #resetAll{background:#dd4444;color:white}
        .note{margin-top:22px;font-size:13px;color:#555;line-height:1.4}
        footer{margin-top:26px;font-size:14px;color:#666}
    </style>
</head>
<body>
<div class="card">
    <div class="drop">💧</div>
    <h1>喝水提醒器</h1>
    <div class="status" id="statusText">待机</div>
    <select id="intervalSelect">
        <option value="60">1分钟</option>
        <option value="300">5分钟</option>
        <option value="900">15分钟</option>
        <option value="1800">30分钟</option>
        <option value="3600">60分钟</option>
    </select>
    <div class="time-view" id="timeDom">--:--</div>
    <div class="cup-text">今日喝水杯数：<span id="cupShow">0</span></div>
    <div class="button-wrap">
        <button id="startBtn">开始</button>
        <button id="pauseBtn">暂停</button>
        <button id="drinkBtn">记录一杯</button>
        <button id="resetBtn">清空统计</button>
    </div>
    <div class="note">⚠️浏览器通知需要授权；iPad锁屏网页定时器失效。数据保存在浏览器本地存储。</div>
    <footer>Created by SXH Studio</footer>
</div>
<script>
    let timer=null;
    let remainTime=0;
    let cupCount=Number(localStorage.getItem('waterCup')||0);
    const intervalSel=document.getElementById('intervalSelect');
    const timeDom=document.getElementById('timeDom');
    const statusText=document.getElementById('statusText');
    const cupShow=document.getElementById('cupShow');
    cupShow.innerText=cupCount;

    function askPermission(){
        if(Notification.permission!=='granted') Notification.requestPermission();
    }
    function notifyAlert(){
        if(Notification.permission==='granted') new Notification("💧喝水提醒","记得喝点水休息一下");
    }
    function format(s){
        const m=Math.floor(s/60);
        const sec=s%60;
        return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }
    document.getElementById('startBtn').onclick=()=>{
        askPermission();
        const t=Number(intervalSel.value);
        if(!timer){
            if(remainTime<=0) remainTime=t;
            statusText.innerText="计时运行中";
            timer=setInterval(()=>{
                remainTime--;
                if(remainTime<=0){
                    notifyAlert();
                    remainTime=t;
                }
                timeDom.innerText=format(remainTime);
            },1000)
        }
    }
    document.getElementById('pauseBtn').onclick=()=>{
        if(timer){
            clearInterval(timer);
            timer=null;
            statusText.innerText="已经暂停";
        }
    }
    document.getElementById('drinkBtn').onclick=()=>{
        cupCount++;
        localStorage.setItem('waterCup',cupCount);
        cupShow.innerText=cupCount;
    }
    document.getElementById('resetBtn').onclick=()=>{
        cupCount=0;
        localStorage.setItem('waterCup',cupCount);
        cupShow.innerText=cupCount;
    }
</script>
</body>
</html>
